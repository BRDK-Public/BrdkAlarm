name: Make Release - From remote workflow
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  call-remote:
    permissions:
      contents: write
    uses: BRDK-Public/BrdkLibrariesProject/.github/workflows/release_one_subtree.yml@main
    with:
      artifact_owner: "BRDK-Public"
      artifact_repo: "BrdkLibrariesProject"
      artifact_workflow_ref: ".github/workflows/build_BrdkAlarm.yml"
      library_name: "BrdkAlarm"
    secrets:
      github-pat-token: ${{ secrets.SERVICE_PAT }}
